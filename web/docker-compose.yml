services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psuser
      POSTGRES_PASSWORD: psuser
      POSTGRES_DB: dv_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psuser -d dv_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://psuser:psuser@db:5432/dv_db
      JWT_SECRET: development-only-secret
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: